name: Release firmware

# Builds the HALSER CV7 wind interface firmware and publishes the
# application binary as a downloadable GitHub Release asset. The published
# .bin is meant for OTA upload (e.g. via `espota.py` / PlatformIO's
# --upload-port over WiFi) against a device already running this firmware
# with OTA enabled — it is not a full-flash image (no bootloader/partition
# table), so first-time programming still requires a wired `pio run -t
# upload`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e halser

      - name: Package binary
        id: package
        run: |
          version="${GITHUB_REF_NAME:-manual-$(date +%Y%m%d%H%M%S)}"
          out="HALSER-cv7-wind-interface-${version}.bin"
          cp .pio/build/halser/firmware.bin "$out"
          echo "asset_path=$out" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset_path }}
          generate_release_notes: true

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_path }}
          path: ${{ steps.package.outputs.asset_path }}
