; HALSER Wind Interface Firmware
; LCJ Capteurs CV7 wind instrument to NMEA 2000 gateway

[platformio]
default_envs = halser

; espidf+arduino dual-framework build. Building ESP-IDF from source makes
; sdkconfig authoritative, which lets us enable CONFIG_MBEDTLS_DYNAMIC_BUFFER
; (see sdkconfig.defaults) -- the dynamic TLS buffer that keeps the Signal K
; connection stable on the memory-constrained ESP32-C3.
[env:halser]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = espidf, arduino
lib_ldf_mode = deep

upload_speed = 2000000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.4.0
    SensESP/NMEA0183 @ ^3.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.1
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=b072eea5-4e65-4ced-94c3-d6f24207062d
    pfeerick/elapsedMillis @ ^1.0.6

build_flags =
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=8
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D SENSESP_SSL_SUPPORT=1
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -D USE_ESP_IDF_LOG

build_unflags = -Werror=reorder
board_build.partitions = min_spiffs.csv
board_build.sdkconfig_path = sdkconfig.defaults
; esp_insights and esp_rainmaker are pulled in transitively by arduino-esp32 on
; esp32c3 and require their server certs embedded, even though this firmware
; uses neither cloud service.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
monitor_filters = esp32_exception_decoder
; Only build the HALSER application's own entry point -- excludes the
; standalone bench-test firmware in src/wroom32_hwt3100_test/.
build_src_filter = +<*> -<wroom32_hwt3100_test/>

; Standalone HWT3100 Modbus wiring/protocol bench test for a plain
; ESP32-WROOM-32 dev board (e.g. AZ-Delivery's ESP32 Dev Kit C), with no
; HALSER board, CV7, or SensESP app involved -- see
; src/wroom32_hwt3100_test/main.cpp. Arduino-only (no espidf) since none of
; the HALSER app's TLS/NMEA2000/OTA machinery is needed for this test.
[env:wroom32_hwt3100_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200

; Only build the bench-test entry point -- excludes main.cpp and everything
; else in src/ (SensESP/NMEA2000/SSD1306 application code, none of which
; this env lists as a dependency).
build_src_filter = -<*> +<wroom32_hwt3100_test/>
monitor_filters = esp32_exception_decoder
